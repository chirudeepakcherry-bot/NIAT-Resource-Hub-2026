<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NIAT AI Tutor</title>
<style>
body{font-family:Arial;background:#0f172a;color:white;margin:0}
.header{background:#1e293b;padding:14px;text-align:center}
.header a{color:#60a5fa;float:left;text-decoration:none;font-size:14px}
.wrap{max-width:700px;margin:0 auto;padding:15px;padding-bottom:110px}
#chat{display:flex;flex-direction:column}
.msg{max-width:85%;padding:12px;margin:8px 0;border-radius:14px;line-height:1.6;font-size:14px;white-space:pre-wrap;word-wrap:break-word}
.user{background:#2563eb;align-self:flex-end}
.bot{background:#1e293b;align-self:flex-start;border:1px solid #334155}
pre{background:#020617;padding:12px;border-radius:8px;overflow-x:auto;white-space:pre-wrap}
.btn{background:#2563eb;color:white;border:none;padding:7px 12px;border-radius:8px;margin:3px;cursor:pointer;font-size:13px}
.btn2{background:#334155;color:white;border:none;padding:7px 12px;border-radius:8px;margin:3px;cursor:pointer;font-size:13px}
.input-wrap{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);width:92%;max-width:700px}
.input-box{display:flex;background:white;border-radius:14px;padding:5px;align-items:center;gap:5px}
.input-box input{flex:1;padding:12px;border:none;font-size:16px;outline:none;color:black}
.mic{background:#334155;color:white;border:none;padding:11px 13px;border-radius:10px;cursor:pointer}
.send{background:#2563eb;color:white;border:none;padding:11px 16px;border-radius:10px;cursor:pointer;font-weight:bold}
</style>
</head>
<body>
<div class="header"><a href="index.html">⬅ Home</a><h3 style="margin:0">🤖 NIAT AI Tutor</h3></div>

<div class="wrap">
<div id="chat">
<div class="msg bot">Hi mawa! 👋 Nenu NIAT AI Tutor ni.

Type chey or 🎤 voice tho adugu:
- hello world
- factorial
- prime
- even odd
- quiz
- interview</div>
</div>
</div>

<div class="input-wrap">
<div class="input-box">
<input id="inp" placeholder="Ask anything..." onkeypress="if(event.key=='Enter')send()">
<button class="mic" onclick="startVoice()">🎤</button>
<button class="send" onclick="send()">Send ➤</button>
</div>
</div>

<script>
const P={
"hello world":{t:"Hello World",c:{Python:'print("Hello NIAT")',Java:'System.out.println("Hello NIAT");',C:'printf("Hello NIAT");',JS:'console.log("Hello NIAT");'},e:"Screen meeda text print cheyadaniki first program mawa.",q:[["Python lo output ki em use chestam?","print"],["Hello World enduku first nerchukuntam?","basic syntax"]]},
"factorial":{t:"Factorial",c:{Python:'n=5\nf=1\nfor i in range(1,n+1):\n f=f*i\nprint(f)',Java:'int f=1;\nfor(int i=1;i<=5;i++) f*=i;\nSystem.out.println(f);',C:'int f=1;\nfor(int i=1;i<=5;i++) f*=i;\nprintf("%d",f);',JS:'let f=1;\nfor(let i=1;i<=5;i++) f*=i;\nconsole.log(f);'},e:"Factorial ante 5! = 5x4x3x2x1 = 120. Loop tho multiply chestam.",q:[["Factorial of 5 enti?","120"],["Loop enduku?","multiply"]]},
"prime":{t:"Prime Number",c:{Python:'n=7\nc=0\nfor i in range(1,n+1):\n if n%i==0: c+=1\nprint("Prime" if c==2 else "Not Prime")',Java:'int c=0;\nfor(int i=1;i<=7;i++) if(7%i==0) c++;',C:'int c=0;\nfor(int i=1;i<=7;i++) if(7%i==0) c++;',JS:'let c=0;\nfor(let i=1;i<=7;i++) if(7%i==0) c++;'},e:"Factors 2 matrame unte Prime mawa. 1 and ade number.",q:[["7 Prime aa?","avunu"],["1 Prime aa?","kadu"]]},
"even odd":{t:"Even or Odd",c:{Python:'n=4\nprint("Even" if n%2==0 else "Odd")',Java:'System.out.println(4%2==0?"Even":"Odd");',C:'printf(4%2==0?"Even":"Odd");',JS:'console.log(4%2==0?"Even":"Odd");'},e:"% ante remainder. 2 tho divide cheste remainder 0 unte Even.",q:[["% ante enti?","remainder"],["10 Even aa?","avunu"]]}
};
const A={"helo":"hello world","hello":"hello world","fact":"factorial","factrial":"factorial","factoral":"factorial","prim":"prime","prime number":"prime","even":"even odd","odd":"even odd"};
let cur=null,lang="Python",mode="",qi=0,score=0,ii=0;
const interviewQ=["Python ante enti?","Variable ante enti?","Loop enduku use chestam?","Function ante enti?","List ante enti?"];

function add(t,w){
let d=document.createElement("div");d.className="msg "+w;d.innerHTML=t;
document.getElementById("chat").appendChild(d);
window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});
}
function speakText(txt){
speechSynthesis.cancel();
let u=new SpeechSynthesisUtterance(txt);u.lang="en-IN";speechSynthesis.speak(u);
}
function startVoice(){
const R=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!R){alert("Voice Chrome lo matrame work avthadi mawa");return;}
const rec=new R();rec.lang="en-IN";
rec.onresult=e=>{document.getElementById("inp").value=e.results[0][0].transcript;send();};
rec.start();
}
function show(key){
cur=key;let p=P[key];
add(`<b>${p.t} - ${lang}</b><pre>${p.c[lang].replace(/</g,"&lt;")}</pre><b>🧠 Explanation:</b> ${p.e}<br><button class="btn" onclick="navigator.clipboard.writeText(P[cur].c[lang]);alert('Copied ✅')">Copy Code</button><button class="btn" onclick="speakText(P[cur].e)">🔊 Speak</button><button class="btn2" onclick="startQuiz()">🎯 Quiz</button><br><button class="btn2" onclick="lang='Python';show(cur)">Python</button><button class="btn2" onclick="lang='Java';show(cur)">Java</button><button class="btn2" onclick="lang='C';show(cur)">C</button><button class="btn2" onclick="lang='JS';show(cur)">JS</button>`,"bot");
}
function startQuiz(){
if(!cur){add("First oka program adugu mawa, tarvata quiz","bot");return;}
mode="quiz";qi=0;score=0;
add(`<b>🎯 Quiz Start!</b><br>Q1: ${P[cur].q[0][0]}`,"bot");
}
function startInterview(){
mode="interview";ii=0;
add(`<b>🎤 Interview Mode</b><br>Q1: ${interviewQ[0]}`,"bot");
}
function send(){
let inp=document.getElementById("inp");let m=inp.value.trim();if(!m)return;
add(m,"user");inp.value="";
let q=m.toLowerCase();
setTimeout(()=>{
if(mode=="quiz"){
let correct=P[cur].q[qi][1].toLowerCase();
if(q.includes(correct)){score++;add("✅ Correct mawa!","bot");}else{add("❌ Wrong. Answer: "+P[cur].q[qi][1],"bot");}
qi++;
if(qi<P[cur].q.length) add(`Q${qi+1}: ${P[cur].q[qi][0]}`,"bot");
else{add(`🏆 Quiz Finish! Score: ${score}/${P[cur].q.length}`,"bot");mode="";}
return;
}
if(mode=="interview"){
ii++;
if(ii<interviewQ.length) add(`✅ Good! Next Q${ii+1}: ${interviewQ[ii]}`,"bot");
else{add("🎉 Interview Complete! Super mawa!","bot");mode="";}
return;
}
if(q=="quiz"){startQuiz();return;}
if(q=="interview"){startInterview();return;}
let key=P[q]?q:A[q];
if(!key) for(let k in P) if(q.includes(k)) key=k;
if(!key) for(let a in A) if(q.includes(a)) key=A[a];
if(key) show(key);
else add("Ardham kaledu mawa 😅<br>Try: <b>hello world, factorial, prime, even odd, quiz, interview</b>","bot");
},350);
}
</script>
</body>
</html>
