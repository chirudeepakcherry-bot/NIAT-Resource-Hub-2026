<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NIAT AI Tutor</title>
<style>
body{font-family:Arial;background:#0f172a;color:white;margin:0;display:flex;flex-direction:column;height:100vh}
.header{background:#1e293b;padding:15px;text-align:center}
.header a{color:#60a5fa;float:left;text-decoration:none}
#chat{flex:1;overflow-y:auto;padding:15px}
.msg{max-width:85%;padding:12px;margin:10px 0;border-radius:14px;line-height:1.6;font-size:14px;white-space:pre-wrap}
.user{background:#2563eb;margin-left:auto}
.bot{background:#1e293b;margin-right:auto}
.bot pre{background:#020617;padding:12px;border-radius:8px;overflow-x:auto;white-space:pre-wrap}
.input-box{display:flex;padding:12px;background:#1e293b;gap:8px}
.input-box input{flex:1;padding:14px;border-radius:12px;border:none;font-size:16px}
.input-box button{background:#2563eb;color:white;border:none;padding:0 20px;border-radius:12px;font-size:16px;cursor:pointer}
.langs{margin-top:8px}
.langs button{background:#334155;color:white;border:none;padding:5px 10px;border-radius:15px;margin:2px;cursor:pointer;font-size:12px}
.langs button.active{background:#2563eb}
</style>
</head>
<body>
<div class="header"><a href="index.html">⬅ Home</a><h2>🤖 NIAT AI Tutor</h2></div>

<div id="chat">
<div class="msg bot">Hi mawa! 👋
Nenu NIAT AI Tutor ni.
Em kavali? Type chey:
• hello world
• factorial
• prime
• even odd</div>
</div>

<div class="input-box">
<input id="userInput" placeholder="Ask anything... e.g. factorial" onkeypress="if(event.key=='Enter')sendMsg()">
<button onclick="sendMsg()">Send</button>
</div>

<script>
const programs={
"hello world":{title:"Hello World",codes:{Python:'print("Hello NIAT")',Java:'public class Main{\n public static void main(String[] a){\n  System.out.println("Hello NIAT");\n }\n}',C:'#include <stdio.h>\nint main(){\n printf("Hello NIAT");\n return 0;\n}',JS:'console.log("Hello NIAT");'},explain:"Screen meeda text print cheyadaniki first program mawa."},
"factorial":{title:"Factorial",codes:{Python:'n=int(input("Enter: "))\nf=1\nfor i in range(1,n+1):\n f=f*i\nprint(f)',Java:'int n=5,f=1;\nfor(int i=1;i<=n;i++) f*=i;\nSystem.out.println(f);',C:'int n=5,f=1;\nfor(int i=1;i<=n;i++) f*=i;\nprintf("%d",f);',JS:'let n=5,f=1;\nfor(let i=1;i<=n;i++) f*=i;\nconsole.log(f);'},explain:"5! = 5x4x3x2x1 = 120. Loop tho multiply chestam."},
"prime":{title:"Prime Number",codes:{Python:'n=int(input("Enter: "))\nc=0\nfor i in range(1,n+1):\n if n%i==0: c+=1\nprint("Prime" if c==2 else "Not Prime")',Java:'int n=7,c=0;\nfor(int i=1;i<=n;i++) if(n%i==0) c++;\nSystem.out.println(c==2?"Prime":"Not Prime");',C:'int n=7,c=0;\nfor(int i=1;i<=n;i++) if(n%i==0) c++;\nprintf(c==2?"Prime":"Not Prime");',JS:'let n=7,c=0;\nfor(let i=1;i<=n;i++) if(n%i==0) c++;\nconsole.log(c==2?"Prime":"Not Prime");'},explain:"Factors 2 matrame unte Prime mawa."},
"even odd":{title:"Even or Odd",codes:{Python:'n=int(input("Enter: "))\nprint("Even" if n%2==0 else "Odd")',Java:'int n=4;\nSystem.out.println(n%2==0?"Even":"Odd");',C:'int n=4;\nprintf(n%2==0?"Even":"Odd");',JS:'let n=4;\nconsole.log(n%2==0?"Even":"Odd");'},explain:"% remainder chustadi. 0 unte Even."}
};
const aliases={"helo":"hello world","hello":"hello world","fact":"factorial","factrial":"factorial","factoral":"factorial","prim":"prime","prime number":"prime","even":"even odd","odd":"even odd"};

let currentProgram=null, currentLang="Python";

function addMsg(text,who){
let d=document.createElement("div");
d.className="msg "+who;
d.innerHTML=text;
document.getElementById("chat").appendChild(d);
document.getElementById("chat").scrollTop=999999;
return d;
}
function showProgram(key){
currentProgram=key;
let p=programs[key];
let html=`<b>${p.title} - ${currentLang}</b><pre>${p.codes[currentLang].replace(/</g,"&lt;")}</pre><b>🧠 Explanation:</b> ${p.explain}<div class="langs">`;
Object.keys(p.codes).forEach(lang=>{
html+=`<button class="${lang==currentLang?'active':''}" onclick="changeLang('${lang}')">${lang}</button>`;
});
html+=`</div><button onclick="copyCode()" style="background:#2563eb;color:white;border:none;padding:6px 12px;border-radius:8px;margin-top:8px;cursor:pointer">Copy Code</button>`;
addMsg(html,"bot");
}
function changeLang(lang){
currentLang=lang;
let msgs=document.querySelectorAll(".bot");
showProgram(currentProgram);
}
function copyCode(){
navigator.clipboard.writeText(programs[currentProgram].codes[currentLang]);
alert("Copied ✅");
}
function sendMsg(){
let input=document.getElementById("userInput");
let msg=input.value.trim();
if(!msg) return;
addMsg(msg,"user");
input.value="";
let q=msg.toLowerCase();
let key=null;
if(programs[q]) key=q;
else if(aliases[q]) key=aliases[q];
else{ for(let k in programs){ if(q.includes(k)) key=k; } for(let a in aliases){ if(q.includes(a)) key=aliases[a]; } }

setTimeout(()=>{
if(key) showProgram(key);
else addMsg("Ardham kaledu mawa 😅<br>Try: <b>hello world, factorial, prime, even odd</b>","bot");
},400);
}
</script>
</body>
</html>
