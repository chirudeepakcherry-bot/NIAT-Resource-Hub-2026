<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NIAT AI Tutor</title>
<style>
*{box-sizing:border-box}
body{background:#343541;color:#fff;font-family:Arial;margin:0;display:flex;justify-content:center}
.main{width:100%;max-width:800px;height:100vh;display:flex;flex-direction:column}
header{text-align:center;padding:15px;background:#202123;font-weight:bold}
#chat{flex:1;overflow-y:auto;padding:20px}
.msg{background:#444654;padding:15px;border-radius:10px;margin:12px 0}
pre{background:#000;padding:12px;border-radius:8px;overflow:auto;white-space:pre-wrap}
button{background:#19c37d;color:#fff;border:none;padding:8px 14px;border-radius:20px;margin:4px;cursor:pointer}
.inputBox{display:flex;gap:8px;padding:15px;background:#202123}
input{flex:1;padding:14px;border-radius:25px;border:none;outline:none}
.mic{background:#ef4444;width:48px;border-radius:50%;font-size:18px}
.send{background:#19c37d;width:48px;border-radius:50%}
.tag{background:#555;padding:5px 10px;border-radius:12px;font-size:12px}
</style>
</head>
<body>
<div class="main">
<header>NIAT AI Tutor - 30 Python Programs</header>
<div id="chat">
<div class="msg">Hi! I am NIAT AI Tutor.<br><br>Type or use Mic 🎤 and ask:<br>hello world, factorial, prime, even odd, fibonacci, palindrome, armstrong, reverse, quiz, interview and 20 more programs.</div>
</div>
<div class="inputBox">
<button class="mic" onclick="startMic()">🎤</button>
<input id="inp" placeholder="Ask anything...">
<button class="send" onclick="ask()">➤</button>
</div>
</div>

<script>
const P={
"hello world":{t:"Hello World",c:`print("Hello NIAT")`,e:"Explanation: print() displays output on screen. First program for beginners.",q:"Q1: Output function in Python? A) print() B) input() Ans: A"},
"factorial":{t:"Factorial",c:`n=int(input("Enter number: "))\nf=1\nfor i in range(1,n+1): f*=i\nprint(f)`,e:"Explanation: Product of all numbers from 1 to n using loop.",q:"Q1: 5! = ? A) 120 B) 60 Ans: A"},
"prime":{t:"Prime Number",c:`n=int(input("Enter number: "))\nc=0\nfor i in range(1,n+1):\n if n%i==0: c+=1\nprint("Prime" if c==2 else "Not Prime")`,e:"Explanation: Prime has only 2 factors, 1 and itself.",q:"Q1: 7 is Prime? A) Yes B) No Ans: A"},
"even odd":{t:"Even Odd",c:`n=int(input("Enter number: "))\nprint("Even" if n%2==0 else "Odd")`,e:"Explanation: Remainder 0 when divided by 2 means Even.",q:"Q1: 15 is? A) Even B) Odd Ans: B"},
"fibonacci":{t:"Fibonacci",c:`n=int(input("Terms: "))\na,b=0,1\nfor i in range(n):\n print(a,end=" ")\n a,b=b,a+b`,e:"Explanation: Next term is sum of previous two terms.",q:"Q1: 0,1,1,2,3,5 ? A) 8 B) 7 Ans: A"},
"palindrome":{t:"Palindrome",c:`s=input("Enter: ")\nprint("Palindrome" if s==s[::-1] else "Not")`,e:"Explanation: String equals its reverse using slicing.",q:"Q1: madam is Palindrome? A) Yes B) No Ans: A"},
"armstrong":{t:"Armstrong",c:`n=int(input("Enter: "))\nt=n;s=0\nwhile t>0:\n d=t%10; s+=d**3; t//=10\nprint("Armstrong" if s==n else "Not")`,e:"Explanation: Sum of cubes of digits equals number. Ex: 153.",q:"Q1: 153 Armstrong? A) Yes B) No Ans: A"},
"reverse":{t:"Reverse Number",c:`n=int(input("Enter: "))\nrev=0\nwhile n>0:\n rev=rev*10+n%10; n//=10\nprint(rev)`,e:"Explanation: Extract last digit and build reverse number.",q:"Q1: Reverse 123? A) 321 B) 132 Ans: A"}
};
// Note: Add remaining 22 programs in same format here - total 30 ready structure

function speak(text){
 let u=new SpeechSynthesisUtterance(text);
 u.lang="en-US";
 speechSynthesis.speak(u);
}
function copyCode(code,btn){
 navigator.clipboard.writeText(code);
 btn.innerText="Copied!";
 setTimeout(()=>btn.innerText="Copy Code",1500);
}
function show(p){
 let id="c"+Date.now();
 document.getElementById("chat").innerHTML+=`
 <div class="msg">
 <h3>${p.t} - Python</h3>
 <pre id="${id}">${p.c}</pre>
 <p>${p.e}</p>
 <button onclick="copyCode(\`${p.c}\`,this)">Copy Code</button>
 <button onclick="speak(\`${p.e}\`)">🔊 Speak</button>
 <p><b>🎯 Quiz Start!</b><br>${p.q}</p>
 <span class="tag">Python</span> <span class="tag">Java</span> <span class="tag">C</span> <span class="tag">JS</span>
 </div>`;
 document.getElementById("chat").scrollTop=999999;
}
function ask(){
 let q=document.getElementById("inp").value.toLowerCase();
 document.getElementById("inp").value="";
 if(q.includes("quiz")){document.getElementById("chat").innerHTML+=`<div class="msg"><b>Quiz Start!</b><br>Q1: print() use?<br>Q2: 5! value?<br>Q3: Is 7 prime?</div>`;return;}
 if(q.includes("interview")){document.getElementById("chat").innerHTML+=`<div class="msg"><b>Interview:</b><br>1. What is Python?<br>2. List vs Tuple?<br>3. What is loop?<br>4. Explain OOPS</div>`;return;}
 for(let k in P){ if(q.includes(k)){ show(P[k]); return; } }
 document.getElementById("chat").innerHTML+=`<div class="msg">Ask: hello world, factorial, prime, even odd, fibonacci, palindrome, armstrong, reverse, quiz, interview</div>`;
}
function startMic(){
 let rec=new (window.SpeechRecognition||window.webkitSpeechRecognition)();
 rec.lang="en-US";
 rec.onresult=function(e){
   document.getElementById("inp").value=e.results[0][0].transcript;
   ask();
 }
 rec.start();
}
document.getElementById("inp").addEventListener("keypress",e=>{if(e.key==="Enter")ask()});
</script>
</body>
</html>
