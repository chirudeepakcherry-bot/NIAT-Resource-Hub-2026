<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NIAT AI Tutor</title>
<style>
body{font-family:Arial;background:#0f172a;color:white;padding:15px;margin:0}
a{color:#60a5fa}
.header{text-align:center;background:#1e293b;padding:20px;border-radius:15px;position:sticky;top:0}
input{width:90%;max-width:500px;padding:14px;border-radius:12px;border:none;font-size:16px;margin-top:10px}
.card{background:#1e293b;padding:18px;margin:18px 0;border-radius:15px;border-left:5px solid #3b82f6}
pre{background:#020617;padding:14px;border-radius:8px;overflow-x:auto}
.btn{background:#3b82f6;color:white;padding:8px 14px;border:none;border-radius:8px;cursor:pointer}
.tabs span{background:#334155;padding:6px 12px;border-radius:8px;cursor:pointer;margin-right:5px;font-size:13px;display:inline-block}
.tabs span.active{background:#3b82f6}
pre{display:none} pre.show{display:block}
.explain{background:#0f172a;padding:12px;border-radius:8px;line-height:1.6;font-size:14px}
details{background:#020617;padding:10px;border-radius:8px;margin-top:8px}
summary{color:#93c5fd;cursor:pointer;font-weight:bold}
</style>
</head>
<body>
<a href="index.html">⬅ Back to Home</a>
<div class="header">
<h1>🤖 NIAT AI Tutor</h1>
<p>Type anything - thappu type chesina correct ga vastadi!</p>
<input id="search" onkeyup="doSearch()" placeholder="Try: helo world, factrial, prim, even...">
</div>
<div id="result"></div>
<div id="programs"></div>

<script>
const data=[
{
title:"Hello World", keys:["hello","helo","world","first"],
codes:{
Python:'print("Hello NIAT")',
Java:'public class Main{public static void main(String[] a){System.out.println("Hello NIAT");}}',
C:'#include <stdio.h>\nint main(){printf("Hello NIAT");return 0;}',
JS:'console.log("Hello NIAT");'
},
explain:"First program mawa. Screen meeda text print cheyadaniki use chestam.",
qa:[["Output enti?","Hello NIAT ani vastadi"],["Why print?","Python lo output chupinchadaniki print() use chestam"]]
},
{
title:"Factorial", keys:["factorial","fact","factrial","factoral"],
codes:{
Python:'n=int(input("Enter: "))\nf=1\nfor i in range(1,n+1):\n f=f*i\nprint(f)',
Java:'import java.util.*;\nclass Main{public static void main(String[] a){Scanner s=new Scanner(System.in);int n=s.nextInt(),f=1;for(int i=1;i<=n;i++)f*=i;System.out.println(f);}}',
C:'#include <stdio.h>\nint main(){int n,f=1;scanf("%d",&n);for(int i=1;i<=n;i++)f*=i;printf("%d",f);return 0;}',
JS:'let n=5,f=1;for(let i=1;i<=n;i++)f*=i;console.log(f);'
},
explain:"Factorial ante 5! = 5x4x3x2x1 = 120. Loop tho multiply chestam.",
qa:[["5! value?","120"],["Loop endi?","Prathi number ni multiply cheyadaniki"]]
},
{
title:"Prime Number", keys:["prime","prim","prime number"],
codes:{
Python:'n=int(input("Enter: "))\nc=0\nfor i in range(1,n+1):\n if n%i==0: c+=1\nprint("Prime" if c==2 else "Not Prime")',
Java:'import java.util.*;\nclass Main{public static void main(String[] a){Scanner s=new Scanner(System.in);int n=s.nextInt(),c=0;for(int i=1;i<=n;i++)if(n%i==0)c++;System.out.println(c==2?"Prime":"Not Prime");}}',
C:'#include <stdio.h>\nint main(){int n,c=0;scanf("%d",&n);for(int i=1;i<=n;i++)if(n%i==0)c++;printf(c==2?"Prime":"Not Prime");return 0;}',
JS:'let n=7,c=0;for(let i=1;i<=n;i++)if(n%i==0)c++;console.log(c==2?"Prime":"Not Prime");'
},
explain:"Prime ante 1 mariyu ade number tho matrame divide ayyedi. Factors count 2 unte Prime.",
qa:[["7 Prime aa?","Avunu, factors 1 and 7 matrame"],["1 Prime aa?","Kadu, factor okkate untadi"]]
},
{
title:"Even or Odd", keys:["even","odd","even odd"],
codes:{
Python:'n=int(input("Enter: "))\nprint("Even" if n%2==0 else "Odd")',
Java:'import java.util.*;\nclass Main{public static void main(String[] a){Scanner s=new Scanner(System.in);int n=s.nextInt();System.out.println(n%2==0?"Even":"Odd");}}',
C:'#include <stdio.h>\nint main(){int n;scanf("%d",&n);printf(n%2==0?"Even":"Odd");return 0;}',
JS:'let n=4;console.log(n%2==0?"Even":"Odd");'
},
explain:"% ante remainder. 2 tho divide cheste remainder 0 unte Even.",
qa:[["% ante enti?","Modulus - remainder istadi"],["10 Even aa?","Avunu"]]
}
];

function makeCard(p,i){
let tabs='',pres='';
Object.keys(p.codes).forEach((lang,j)=>{
tabs+=`<span class="${j==0?'active':''}" onclick="showTab(this,${i},'${lang}')">${lang}</span>`;
pres+=`<pre id="p${i}-${lang}" class="${j==0?'show':''}">${p.codes[lang].replace(/</g,"&lt;")}</pre>`;
});
let qas=p.qa.map(q=>`<details><summary>Q: ${q[0]}</summary><p>${q[1]}</p></details>`).join('');
return `<div class="card"><h3>${p.title}</h3><div class="tabs">${tabs}</div>${pres}<button class="btn" onclick="copyCode(${i},this)">Copy Code</button><div class="explain"><b>🧠 Explanation:</b> ${p.explain}</div>${qas}</div>`;
}
function showTab(el,i,lang){
let card=el.closest('.card');
card.querySelectorAll('pre').forEach(x=>x.classList.remove('show'));
card.querySelectorAll('span').forEach(x=>x.classList.remove('active'));
document.getElementById(`p${i}-${lang}`).classList.add('show');
el.classList.add('active');
}
function copyCode(i,btn){
let pre=document.querySelectorAll(`[id^="p${i}-"].show`)[0] || document.querySelector(`[id^="p${i}-"]`);
if(pre) navigator.clipboard.writeText(pre.innerText);
btn.innerText="Copied ✅"; setTimeout(()=>btn.innerText="Copy Code",1500);
}
function render(list){
document.getElementById('programs').innerHTML=list.map((p)=>makeCard(p,data.indexOf(p))).join('');
}
function doSearch(){
let q=document.getElementById('search').value.toLowerCase().trim();
if(!q){render(data);document.getElementById('result').innerHTML="";return;}
let found=data.filter(p=>p.keys.some(k=>k.includes(q)||q.includes(k)||p.title.toLowerCase().includes(q)));
if(found.length){render(found);document.getElementById('result').innerHTML=`<p style="text-align:center;color:#4ade80">✅ ${found.length} result(s) dorikindi mawa!</p>`;}
else{document.getElementById('programs').innerHTML="";document.getElementById('result').innerHTML=`<p style="text-align:center;color:#f87171">❌ Ardham kaledu mawa, 'hello', 'factorial', 'prime' try chey</p>`;}
}
render(data);
</script>
</body>
</html>
